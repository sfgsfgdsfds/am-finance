name: AMFinance
options:
  bundleIdPrefix: vn.amx
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"

packages:
  FinanceCore:
    path: Packages/FinanceCore

targets:
  AMFinance:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: FinanceCore
        product: FinanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.amx.finance
        DEVELOPMENT_TEAM: T6Z3K9KBDB
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: AM Finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  AMFinanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests
    dependencies:
      - target: AMFinance
      - package: FinanceCore
        product: FinanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.amx.finance.tests
        DEVELOPMENT_TEAM: T6Z3K9KBDB
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AMFinance.app/AMFinance
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  AMFinance:
    build:
      targets:
        AMFinance: all
        AMFinanceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AMFinanceTests
    archive:
      config: Release
